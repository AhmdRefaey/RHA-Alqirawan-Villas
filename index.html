<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"

        content="width=device-width, initial-scale=1">

  <title>فـلل رهـا القـيروان </title>

  <style>

    body {

      font-family: Tahoma, Arial, sans-serif;

      background: #eee8db;

      color: #020202;

      text-align: center;

      padding: 50px 20px;

    }

    h1 {

      color: #765b45;

    }

  </style>

</head>

<body>
<header class="header">

  <img src="logo.png"

       alt="رها العقارية"

       style="width:180px;max-width:100%;height:auto;display:block;margin:0 auto 20px;">
<img src="villa-render.jpg.PNG"

     alt="فلل رها القيروان"

     style="display:block;width:100%;max-width:900px;height:auto;margin:20px auto;border-radius:12px;">
  <h1>فلل رها القيروان</h1>
 

  

  <h2>سجل اهتمامك</h2>

 <form id="interestForm" style="max-width:500px;margin:25px auto;text-align:right;">

  <label for="name">الاسم الكامل *</label>

  <input id="name" name="name" type="text"

    placeholder="اكتب اسمك الكامل"

    autocomplete="name" required>

  <label for="phone">رقم الجوال السعودي *</label>

  <input id="phone" name="phone" type="tel"

    inputmode="numeric" dir="ltr"

    placeholder="05XXXXXXXX"

    pattern="05[0-9]{8}"

    maxlength="10" required>

  <label for="area">ما هي المساحة التي تناسبك؟ *</label>

<select id="area" name="area" required>

  <option value="">اختر المساحة المناسبة</option>

  <option value="250 م²">250 م²</option>

  <option value="300 م²">300 م²</option>

  <option value="427 م²">427 م²</option>

  <option value="لم أحدد المساحة بعد">لم أحدد المساحة بعد</option>

  <option value="أخرى">أخرى</option>

</select>
  <label for="contactMethod">ما هي طريقة التواصل المفضلة لديك؟ *</label>

<select id="contactMethod" name="contactMethod" required>

  <option value="">اختر طريقة التواصل</option>

  <option value="واتساب">واتساب</option>

  <option value="اتصال هاتفي">اتصال هاتفي</option>

  <option value="لا مانع من الطريقتين">لا مانع من الطريقتين</option>

</select> 
  <label for="time">ما الوقت المناسب للتواصل معك؟ *</label>

<select id="time" name="time" required>

  <option value="">اختر الوقت المناسب</option>

  <option value="صباحاً (9 ص - 12 ظهراً)">صباحاً (9 ص - 12 ظهراً)</option>

  <option value="بعد الظهر (12 - 5 م)">بعد الظهر (12 - 5 م)</option>

  <option value="مساءً (5 - 9 م)">مساءً (5 - 9 م)</option>

  <option value="أي وقت مناسب">أي وقت مناسب</option>

</select>

  <label for="notes">ملاحظات (اختياري)</label>

  <textarea id="notes" name="notes"

    rows="4" maxlength="500"

    placeholder="اكتب ملاحظاتك"></textarea>

  <label style="display:flex;align-items:center;gap:8px;font-weight:normal;">

    <input type="checkbox" required style="width:auto;">

    أوافق على استخدام بياناتي للتواصل معي بخصوص مشروع فلل رها القيروان.

  </label>

  <button type="submit">تسجيل الاهتمام</button>

  <p id="formMessage" role="status"></p>

</form>

<style>

#interestForm label {

  display:block;

  margin:18px 0 8px;

  font-weight:bold;

  color:#020202;

}

#interestForm input:not([type="checkbox"]),

#interestForm select,

#interestForm textarea {

  box-sizing:border-box;

  display:block;

  width:100%;

  padding:15px;

  border:1px solid #c6b9a6;

  border-radius:9px;

  background:white;

  font:inherit;

  margin-bottom:15px;

}

#interestForm button {

  width:100%;

  padding:16px;

  background:#80664e;

  color:white;

  border:0;

  border-radius:9px;

  font:inherit;

  font-weight:bold;

  cursor:pointer;

}

</style>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbyxyMnFVlcUFAxN8Rjy3srARKnWmpGW20oQABVViVUsQ_x2lRgTcOAnUWOeHxzVrO2pTQ/exec";

document.getElementById("interestForm")

  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const form = this;

    const button = form.querySelector('button[type="submit"]');

    const message = document.getElementById("formMessage");

    const data = {

      name: form.elements["name"].value,

      phone: form.elements["phone"].value,
area: form.elements["area"].value,
contactMethod: form.elements["contactMethod"].value,
      contactTime: form.elements["time"].value,

      notes: form.elements["notes"].value

    };

    button.disabled = true;

    message.textContent = "جارٍ إرسال البيانات...";

    try {

      await fetch(scriptURL, {

        method: "POST",

        mode: "no-cors",

        headers: {

          "Content-Type": "text/plain;charset=utf-8"

        },

        body: JSON.stringify(data)

      });

      message.textContent =

        "تم إرسال الطلب. جارٍ التحقق من تسجيله.";

      form.reset();

    } catch (error) {

      message.textContent =

        "تعذر إرسال الطلب. حاول مرة أخرى.";

    } finally {

      button.disabled = false;

    }

  });

</script>
</body>

</html>
